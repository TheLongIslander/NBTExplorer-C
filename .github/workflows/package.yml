name: Native desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate version and tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^project\(c_nbt_explorer VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES C\)$/\1/p' CMakeLists.txt)"
          if [[ -z "$version" ]]; then
            echo "Could not read the project version from CMakeLists.txt" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match project version v${version}" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tagged_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
            if ! git merge-base --is-ancestor "$tagged_commit" origin/main; then
              echo "Release tag $GITHUB_REF_NAME does not point to a commit on main" >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    name: ${{ matrix.os }} desktop package
    needs: metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          # Build on Ubuntu 22.04 so the AppImage does not inherit a glibc
          # baseline newer than distributions we advertise as supported.
          - ubuntu-22.04
          - macos-latest
          # Windows Server 2022 includes NSIS; the 2025 image removed it.
          - windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux packaging prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.9.*"
          cache: true

      - name: Configure desktop application
        if: runner.os != 'macOS'
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DNBT_EXPLORER_BUILD_DESKTOP=ON

      - name: Configure universal macOS application
        if: runner.os == 'macOS'
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DNBT_EXPLORER_BUILD_DESKTOP=ON
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build desktop application
        run: cmake --build build --config Release --parallel

      - name: Run smoke tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run CLI integration suite
        if: runner.os != 'Windows'
        run: |
          make -B --jobs 2
          make test

      - name: Build AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: ./packaging/build-appimage.sh "$PWD/build" "$PWD/dist"

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: cpack --config build/CPackConfig.cmake -G DragNDrop -C Release -B dist

      - name: Build Windows portable ZIP
        if: runner.os == 'Windows'
        run: cpack --config build/CPackConfig.cmake -G ZIP -C Release -B dist

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: cpack --config build/CPackConfig.cmake -G NSIS -C Release -B dist

      - name: Verify Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          appimage="$PWD/dist/C-NBT-Explorer-${VERSION}-Linux-x86_64.AppImage"
          test -s "$appimage"
          verify_dir="$(mktemp -d)"
          (cd "$verify_dir" && "$appimage" --appimage-extract >/dev/null)
          test -x "$verify_dir/squashfs-root/AppRun"

          max_glibc="$({
            while IFS= read -r -d '' candidate; do
              if file "$candidate" | grep -q 'ELF'; then
                {
                  objdump -T "$candidate" 2>/dev/null |
                    sed -nE 's/.*\(GLIBC_([0-9]+(\.[0-9]+)+)\).*/\1/p'
                } || true
              fi
            done < <(find "$verify_dir/squashfs-root" -type f -print0)
          } | sort -V | tail -n 1)"
          if [[ -z "$max_glibc" ]]; then
            echo "Could not determine the AppImage glibc requirement" >&2
            exit 1
          fi
          if [[ "$(printf '%s\n' "$max_glibc" '2.35' | sort -V | tail -n 1)" != '2.35' ]]; then
            echo "AppImage requires glibc $max_glibc; maximum supported baseline is 2.35" >&2
            exit 1
          fi
          echo "Maximum AppImage glibc requirement: $max_glibc"

      - name: Verify universal macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          executable="build/C-NBT Explorer.app/Contents/MacOS/C-NBT Explorer"
          dmg="dist/C-NBT-Explorer-${VERSION}-Darwin-universal.dmg"
          lipo "$executable" -verify_arch arm64 x86_64
          test -s "$dmg"
          hdiutil verify "$dmg"

      - name: Verify Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "dist/C-NBT-Explorer-$env:VERSION-Windows-x86_64.zip"
          $installer = "dist/C-NBT-Explorer-$env:VERSION-Windows-x86_64.exe"
          if (!(Test-Path $zip) -or (Get-Item $zip).Length -eq 0) {
            throw "Missing or empty portable ZIP: $zip"
          }
          if (!(Test-Path $installer) -or (Get-Item $installer).Length -eq 0) {
            throw "Missing or empty NSIS installer: $installer"
          }
          $entries = & cmake -E tar tf $zip | ForEach-Object { $_ -replace '\\', '/' }
          if (!($entries -match 'bin/cnbt-explorer\.exe$')) {
            throw 'Portable ZIP does not contain bin/cnbt-explorer.exe'
          }
          $requiredRuntimeDlls = @(
            'msvcp140.dll',
            'msvcp140_1.dll',
            'msvcp140_2.dll',
            'vcruntime140.dll',
            'vcruntime140_1.dll'
          )
          foreach ($runtimeDll in $requiredRuntimeDlls) {
            if (!($entries -match "bin/$([regex]::Escape($runtimeDll))$")) {
              throw "Portable ZIP does not contain required MSVC runtime $runtimeDll"
            }
          }

      - name: Upload Linux package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: C-NBT-Explorer-Linux
          path: dist/C-NBT-Explorer-${{ needs.metadata.outputs.version }}-Linux-x86_64.AppImage
          if-no-files-found: error
          compression-level: 0

      - name: Upload macOS package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: C-NBT-Explorer-macOS
          path: dist/C-NBT-Explorer-${{ needs.metadata.outputs.version }}-Darwin-universal.dmg
          if-no-files-found: error
          compression-level: 0

      - name: Upload Windows packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: C-NBT-Explorer-Windows
          path: |
            dist/C-NBT-Explorer-${{ needs.metadata.outputs.version }}-Windows-x86_64.exe
            dist/C-NBT-Explorer-${{ needs.metadata.outputs.version }}-Windows-x86_64.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: Create draft GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - metadata
      - package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: C-NBT-Explorer-*
          path: release
          merge-multiple: true

      - name: Verify packages and generate checksums
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          assets=(
            "release/C-NBT-Explorer-${VERSION}-Darwin-universal.dmg"
            "release/C-NBT-Explorer-${VERSION}-Windows-x86_64.exe"
            "release/C-NBT-Explorer-${VERSION}-Windows-x86_64.zip"
            "release/C-NBT-Explorer-${VERSION}-Linux-x86_64.AppImage"
          )

          for asset in "${assets[@]}"; do
            if [[ ! -s "$asset" ]]; then
              echo "Missing or empty release asset: $asset" >&2
              exit 1
            fi
          done

          sha256sum "${assets[@]}" | sed 's#  release/#  #' > release/SHA256SUMS
          cat release/SHA256SUMS

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          assets=(
            "release/C-NBT-Explorer-${VERSION}-Darwin-universal.dmg"
            "release/C-NBT-Explorer-${VERSION}-Windows-x86_64.exe"
            "release/C-NBT-Explorer-${VERSION}-Windows-x86_64.zip"
            "release/C-NBT-Explorer-${VERSION}-Linux-x86_64.AppImage"
            release/SHA256SUMS
          )

          if release_state="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$release_state" != "true" ]]; then
              echo "Release $GITHUB_REF_NAME already exists and is published; refusing to replace its assets" >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "C-NBT Explorer ${GITHUB_REF_NAME}"
          fi
